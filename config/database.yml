default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: realworld_development

test:
  <<: *default
  database: realworld_test

production:
  <<: *default
  url: <%= ENV['DATABASE_URL'] %>  # DATABASE_URLを使うように変更
